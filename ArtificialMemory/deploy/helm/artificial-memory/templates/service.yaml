apiVersion: v1
kind: Service
metadata:
  name: {{ include "memory.name" . }}
  labels:
    {{- include "memory.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "memory.labels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
