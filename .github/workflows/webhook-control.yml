name: WebhookControl

on:
  pull_request:
    paths:
      - 'WebhookControl/**'
      - '.github/workflows/webhook-control.yml'
  push:
    branches: [main]
    paths:
      - 'WebhookControl/**'
      - '.github/workflows/webhook-control.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webhook-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: WebhookControl/go.mod
          cache: false
      - name: Check, test and build
        working-directory: WebhookControl
        run: make check test build
