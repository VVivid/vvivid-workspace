name: AgentShoppingList

on:
  pull_request:
    paths:
      - 'AgentShoppingList/**'
  push:
    branches: [main]
    paths:
      - 'AgentShoppingList/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopping-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: AgentShoppingList/go.mod
          cache-dependency-path: AgentShoppingList/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check and build
        working-directory: AgentShoppingList
        run: |
          make check build
