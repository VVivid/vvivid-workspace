name: Website checks and release artifacts

on:
  pull_request:
    paths:
      - 'vvivid.dev/**'
      - '.github/**'
      - 'Makefile'
  push:
    branches: [main, 'release/vvivid.dev/*']
    tags: ['vvivid.dev/v*']

permissions:
  contents: read

jobs:
  check:
    name: Check website (${{ matrix.channel }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - channel: staging
            base_url: https://preview.vvivid.dev/
          - channel: production
            base_url: https://vvivid.dev/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install checksum-pinned build tools
        run: bash .github/scripts/install-website-tools.sh
      - name: Native site and release policy checks
        env:
          HUGO_BASEURL: ${{ matrix.base_url }}
        run: |
          make -C vvivid.dev check
          make -C vvivid.dev chart-test
      - name: Build Linux amd64 and exercise the real serving image
        env:
          BASE_URL: ${{ matrix.base_url }}
        run: |
          docker build --platform linux/amd64 --tag vvivid-website:check \
            --build-arg "HUGO_BASEURL=$BASE_URL" ./vvivid.dev
          ./vvivid.dev/scripts/smoke-image.sh vvivid-website:check "$BASE_URL"

  publish:
    name: Publish website and record GitOps desired state
    needs: check
    # Activation is a repository variable. Main only checks; PRs never enter this job.
    if: >-
      github.event_name == 'push' && github.ref != 'refs/heads/main' &&
      vars.WEBSITE_GITOPS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: artifact-publication
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: monorepo-artifact-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install checksum-pinned build tools
        run: bash .github/scripts/install-website-tools.sh
      - name: Validate exact release identity
        id: release
        run: |
          python3 vvivid.dev/deploy/gitops/publish.py --plan > "$RUNNER_TEMP/website-plan.json"
          jq --raw-output 'to_entries[] | "\(.key)=\(.value)"' "$RUNNER_TEMP/website-plan.json" >> "$GITHUB_OUTPUT"
      - name: Build and smoke-check the candidate before publication
        env:
          BASE_URL: ${{ steps.release.outputs.base_url }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          make -C vvivid.dev deployment-test chart-test
          docker build --platform linux/amd64 --tag vvivid-website:release-check \
            --build-arg "HUGO_BASEURL=$BASE_URL" \
            --label "org.opencontainers.image.source=https://github.com/VVivid/vvivid-workspace" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "dev.vvivid.source-ref=$SOURCE_REF" --label "dev.vvivid.base-url=$BASE_URL" ./vvivid.dev
          ./vvivid.dev/scripts/smoke-image.sh vvivid-website:release-check "$BASE_URL"
      - name: Join the shared CI tailnet identity using GitHub OIDC
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: ${{ vars.TS_CI_TAG }}
      - name: Publish versioned Zot artifacts
        env:
          ZOT_USERNAME: ${{ vars.ZOT_PRODUCTS_PUSH_USERNAME }}
          ZOT_PASSWORD: ${{ secrets.ZOT_PRODUCTS_PUSH_PASSWORD }}
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/website-docker
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/website-helm/registry.json
        run: |
          umask 077
          mkdir -p "$DOCKER_CONFIG" "$(dirname "$HELM_REGISTRY_CONFIG")"
          trap 'rm -rf "$DOCKER_CONFIG" "$(dirname "$HELM_REGISTRY_CONFIG")"' EXIT
          printf '%s' "$ZOT_PASSWORD" | docker login registry.lab.vvivid.dev --username "$ZOT_USERNAME" --password-stdin
          printf '%s' "$ZOT_PASSWORD" | helm registry login registry.lab.vvivid.dev --username "$ZOT_USERNAME" --password-stdin
          python3 vvivid.dev/deploy/gitops/publish.py --output "$RUNNER_TEMP/website-release.json"
      - name: Mint the GitOps-only GitHub App installation token
        id: gitops-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: VVivid
          repositories: homelab-gitops
          permission-contents: write
      - name: Record exact artifacts in the fixed private GitOps environment file
        env:
          GITOPS_TOKEN: ${{ steps.gitops-token.outputs.token }}
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          image_digest=$(jq --raw-output .imageDigest "$RUNNER_TEMP/website-release.json")
          chart_digest=$(jq --raw-output .chartDigest "$RUNNER_TEMP/website-release.json")
          python3 vvivid.dev/deploy/gitops/promote.py --ref "$SOURCE_REF" --sha "$SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --image-digest "$image_digest" --chart-digest "$chart_digest"
          printf 'Recorded exact website image and Helm chart in private GitOps desired state. Fleet/runtime acceptance is separate.\n' >> "$GITHUB_STEP_SUMMARY"
