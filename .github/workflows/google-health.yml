name: GoogleHealthMCP

on:
  pull_request:
    paths:
      - 'GoogleHealthMCP/**'
  push:
    branches: [main]
    paths:
      - 'GoogleHealthMCP/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: GoogleHealthMCP/go.mod
          cache-dependency-path: GoogleHealthMCP/go.sum
      - name: Check and build
        working-directory: GoogleHealthMCP
        run: |
          make check build
