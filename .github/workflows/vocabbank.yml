name: VocabBank checks and production artifacts

on:
  pull_request:
    paths:
      - 'VocabBank/**'
      - '.github/workflows/vocabbank.yml'
      - '.github/scripts/install-vocabbank-tools.sh'
      - 'Makefile'
  push:
    branches: [main]
    tags: ['VocabBank/v*']
    paths:
      - 'VocabBank/**'
      - '.github/workflows/vocabbank.yml'
      - '.github/scripts/install-vocabbank-tools.sh'
      - 'Makefile'

permissions:
  contents: read

jobs:
  check:
    name: Check VocabBank
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: VocabBank/go.mod
          cache-dependency-path: VocabBank/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: VocabBank/web/package-lock.json
      - name: Install pinned Helm and check-only Python dependencies
        run: |
          bash .github/scripts/install-vocabbank-tools.sh
          python3 -m venv "$RUNNER_TEMP/vocab-checks"
          "$RUNNER_TEMP/vocab-checks/bin/pip" install --disable-pip-version-check -r VocabBank/deploy/gitops/requirements.txt
      - name: Install application and Chromium system dependencies
        run: |
          make -C VocabBank deps
          npm --prefix VocabBank/web exec -- playwright install-deps chromium
      - name: Verify browser, gateway, MCP, persistence, release and Helm contracts
        run: |
          make -C VocabBank check test race build
          make -C VocabBank browser-install browser-test
          make -C VocabBank check test
          make -C VocabBank chart-test PYTHON="$RUNNER_TEMP/vocab-checks/bin/python"
      - name: Build Linux amd64 and test the real production executable
        run: |
          docker build --platform linux/amd64 --tag vocabbank:local ./VocabBank
          make -C VocabBank container-test

  publish:
    name: Publish VocabBank and record production desired state
    needs: check
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/VocabBank/v') &&
      vars.VOCAB_GITOPS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: artifact-publication
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: monorepo-artifact-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: VocabBank/go.mod
          cache-dependency-path: VocabBank/go.sum
      - name: Install checksum-pinned release tools
        run: bash .github/scripts/install-vocabbank-tools.sh
      - name: Validate production identity and merged source
        id: release
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 VocabBank/deploy/gitops/publish.py --plan > "$RUNNER_TEMP/vocab-plan.json"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          jq --raw-output 'to_entries[] | "\(.key)=\(.value)"' "$RUNNER_TEMP/vocab-plan.json" >> "$GITHUB_OUTPUT"
      - name: Build and exercise the candidate before publication
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ steps.release.outputs.chart_version }}
        run: |
          docker build --platform linux/amd64 --tag vocabbank:release-check \
            --build-arg "VERSION=$VERSION" --build-arg "COMMIT=$SOURCE_SHA" \
            --label 'org.opencontainers.image.source=https://github.com/VVivid/vvivid-workspace' \
            --label "dev.vvivid.source-ref=$SOURCE_REF" \
            --label 'dev.vvivid.base-url=https://vocab.vvivid.dev/' ./VocabBank
          make -C VocabBank container-test TEST_IMAGE=vocabbank:release-check
      - name: Join the existing shared CI tailnet identity through GitHub OIDC
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: ${{ vars.TS_CI_TAG }}
      - name: Publish exact versioned Zot artifacts
        env:
          ZOT_USERNAME: ${{ vars.ZOT_PRODUCTS_PUSH_USERNAME }}
          ZOT_PASSWORD: ${{ secrets.ZOT_PRODUCTS_PUSH_PASSWORD }}
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/vocab-docker
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/vocab-helm/registry.json
        run: |
          umask 077
          mkdir -p "$DOCKER_CONFIG" "$(dirname "$HELM_REGISTRY_CONFIG")"
          trap 'rm -rf "$DOCKER_CONFIG" "$(dirname "$HELM_REGISTRY_CONFIG")"' EXIT
          printf '%s' "$ZOT_PASSWORD" | docker login registry.lab.vvivid.dev --username "$ZOT_USERNAME" --password-stdin
          printf '%s' "$ZOT_PASSWORD" | helm registry login registry.lab.vvivid.dev --username "$ZOT_USERNAME" --password-stdin
          python3 VocabBank/deploy/gitops/publish.py --output "$RUNNER_TEMP/vocab-release.json"
      - name: Mint the existing GitOps-only App installation token
        id: gitops-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: VVivid
          repositories: homelab-gitops
          permission-contents: write
      - name: Record exact production release fields in the fixed private file
        env:
          GITOPS_TOKEN: ${{ steps.gitops-token.outputs.token }}
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          image_digest=$(jq --raw-output .imageDigest "$RUNNER_TEMP/vocab-release.json")
          chart_digest=$(jq --raw-output .chartDigest "$RUNNER_TEMP/vocab-release.json")
          python3 VocabBank/deploy/gitops/promote.py --ref "$SOURCE_REF" --sha "$SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --image-digest "$image_digest" --chart-digest "$chart_digest"
          printf 'Recorded exact VocabBank image/chart. Fleet, identity, tunnel, DNS and browser acceptance are separate.\n' >> "$GITHUB_STEP_SUMMARY"
