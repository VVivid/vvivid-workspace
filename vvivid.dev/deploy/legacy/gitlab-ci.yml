stages:
  - validate
  - build
  - deploy_preview
  - deploy_live

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_BUILDKIT: "1"
  INFRA_DIR: /infra
  PREVIEW_URL: https://preview.vvivid.dev/
  LIVE_URL: https://vvivid.dev/
  VVIVID_RELEASE_KEEP: "3"

validate:
  stage: validate
  image:
    name: hugomods/hugo:exts
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        base_url="$LIVE_URL"
      else
        base_url="$PREVIEW_URL"
      fi
      hugo --minify --baseURL "$base_url"
      leaked="$(find public -type f \( -iname 'agents.md' -o -iname 'agent.md' \) -print -quit)"
      if [ -n "$leaked" ]; then
        echo "Agent guide leaked into public output: $leaked"
        exit 1
      fi

build_preview:
  stage: build
  image: docker:29.1.3-cli
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - docker version
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --pull --build-arg HUGO_BASEURL="$PREVIEW_URL" -t "$CI_REGISTRY_IMAGE:preview" .
    - docker push "$CI_REGISTRY_IMAGE:preview"

build_release:
  stage: build
  image: docker:29.1.3-cli
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - docker version
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      if ! echo "$CI_COMMIT_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
        echo "Git tag '$CI_COMMIT_TAG' is not a valid Docker image tag"
        exit 1
      fi
    - docker build --pull --build-arg HUGO_BASEURL="$LIVE_URL" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"

deploy_preview:
  stage: deploy_preview
  image: docker:29.1.3-cli
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache curl docker-cli-compose
    - test -f "$INFRA_DIR/compose.yml"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker compose --project-directory "$INFRA_DIR" -f "$INFRA_DIR/compose.yml" pull vvivid-preview
    - docker compose --project-directory "$INFRA_DIR" -f "$INFRA_DIR/compose.yml" up -d vvivid-preview
    - |
      local_ok=0
      for i in $(seq 1 30); do
        if curl --fail --silent --show-error --location --max-time 5 --header "Host: preview.vvivid.dev" http://traefik/ > /dev/null; then
          local_ok=1
          break
        fi
        sleep 1
      done
      test "$local_ok" -eq 1
    - |
      public_code=$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out "%{http_code}" "$PREVIEW_URL" || true)
      case "$public_code" in
        200)
          echo "Public preview smoke test passed"
          ;;
        000|404)
          echo "Skipping public preview smoke test because preview.vvivid.dev is not routed through Cloudflare yet, public_code=$public_code"
          ;;
        *)
          echo "Public preview smoke test failed, public_code=$public_code"
          exit 1
          ;;
      esac
    - ./scripts/cleanup-vvivid-images.sh

deploy_live:
  stage: deploy_live
  image: docker:29.1.3-cli
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apk add --no-cache curl docker-cli-compose
    - test -f "$INFRA_DIR/compose.yml"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - export VVIVID_LIVE_TAG="$CI_COMMIT_TAG"
    - docker compose --project-directory "$INFRA_DIR" -f "$INFRA_DIR/compose.yml" pull vvivid-live
    - docker compose --project-directory "$INFRA_DIR" -f "$INFRA_DIR/compose.yml" up -d vvivid-live
    - |
      local_ok=0
      for i in $(seq 1 30); do
        if curl --fail --silent --show-error --location --max-time 5 --header "Host: vvivid.dev" http://traefik/ > /dev/null; then
          local_ok=1
          break
        fi
        sleep 1
      done
      test "$local_ok" -eq 1
    - curl --fail --silent --show-error --location --max-time 30 "$LIVE_URL" > /dev/null
    - ./scripts/persist-vvivid-live-tag.sh "$CI_COMMIT_TAG" "$INFRA_DIR/.env"
    - ./scripts/cleanup-vvivid-images.sh
