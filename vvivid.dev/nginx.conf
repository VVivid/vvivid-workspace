js_import representations from /etc/nginx/representations.js;
js_set $page_index representations.index;
js_set $discovery_links representations.links;

map $uri $page_directory {
    ~^(?<page_parent>.*)/index\.(?:html|md)$ $page_parent/;
    default $uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.xml;
    charset utf-8;
    charset_types text/plain text/css text/markdown text/xml application/xml application/javascript application/rss+xml;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/markdown text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    error_page 404 /404.html;

    location ~* (^|/)agents?\.md(?:/|$) {
        return 404;
    }

    # Only generated page representations participate in Accept negotiation.
    location ~ (?:/|/index\.html)$ {
        if ($page_index = unacceptable) {
            return 406;
        }
        types { text/html html; text/markdown md; }
        try_files $page_directory$page_index =404;

        # HTML and Markdown often share a build timestamp. Do not let a
        # conditional request reuse the other representation through a 304.
        etag off;
        if_modified_since off;
    }

    location ~ \.md$ {
        types { text/markdown md; }
        try_files $uri =404;
        etag off;
        if_modified_since off;
    }

    location ~ /index\.xml$ {
        types { application/rss+xml xml; }
        try_files $uri =404;
    }

    location = /sitemap.xml {
        types { application/xml xml; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        # A location's add_header directives replace the server's set.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Cloudflare does not vary its cache by Accept by default. Keep page and
    # discovery responses out of shared caches until explicitly configured.
    add_header Cache-Control "no-store" always;
    add_header Vary "Accept" always;
    add_header Link $discovery_links;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
}
