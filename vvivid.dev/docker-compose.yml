services:
  mysite:
    build: .
    restart: unless-stopped
    networks:
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vvivid.rule=Host(`vvivid.dev`)"
      - "traefik.http.routers.vvivid.entrypoints=websecure"
      - "traefik.http.routers.vvivid.tls=true"
      - "traefik.http.routers.vvivid.tls.certresolver=letsencrypt"
      - "traefik.http.services.vvivid.loadbalancer.server.port=80"

networks:
  traefik_network:
    external: true
