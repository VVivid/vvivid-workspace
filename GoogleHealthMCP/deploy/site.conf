server {
    listen 8080;
    server_name health.vvivid.dev;
    root /usr/share/nginx/html;
    index index.html;

    # TLS terminates at Traefik. Directory redirects must retain the public
    # browser origin instead of exposing NGINX's internal HTTP port.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }
}
