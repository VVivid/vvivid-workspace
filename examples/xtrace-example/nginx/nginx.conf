worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    include mime.types;
    access_log /dev/stdout;
    resolver 127.0.0.11 ipv6=off;
    lua_max_pending_timers 128;
    lua_max_running_timers 16;

    server {
        listen 80;
        location = / {
            root /usr/local/openresty/nginx/html;
            try_files /index.html =404;
            add_header Cache-Control "no-store";
        }
        location = /cat.svg {
            set $trace_task_id "";
            set $trace_op_id "";
            access_by_lua_file /etc/nginx/trace.lua;
            proxy_pass http://traefik:80;
            proxy_cache off;
            proxy_buffering off;
            proxy_next_upstream off;
            proxy_set_header X-XTrace-TaskID $trace_task_id;
            proxy_set_header X-XTrace-OpID $trace_op_id;
            proxy_set_header X-XTrace-ParentID "";
            proxy_set_header X-XTrace-EdgeType "";
            proxy_hide_header X-XTrace-TaskID;
            proxy_hide_header Cache-Control;
            add_header X-XTrace-TaskID $trace_task_id always;
            add_header X-Worktree-URL "http://localhost:8081/worktree?taskID=$trace_task_id" always;
            add_header Cache-Control "no-store" always;
        }
        location / { return 404; }
    }
}
