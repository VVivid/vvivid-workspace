{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-browser
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ .Values.hostname }}]
      secretName: vocabbank-tls
  rules:
    - host: {{ .Values.hostname }}
      http:
        paths:
          {{- range list "/" "/auth/login" "/auth/callback" "/auth/logout" "/api/v1/session" }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ $.Release.Name }}
                port: {number: 8090}
          {{- end }}
          {{- range list "/api/v1/words" "/_next/" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}
                port: {number: 8090}
          {{- end }}
{{- end }}
