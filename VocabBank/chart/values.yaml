# Release placeholders deliberately prevent accidental enrollment.
image:
  repository: registry.lab.vvivid.dev/products/vocabbank
  digest: UNCONFIGURED
imagePullSecrets:
  - name: vocabbank-registry-pull
hostname: vocab.vvivid.dev
replicaCount: 1
# Stop the only SQLite writer before offline enrollment or claim changes.
maintenance: true
identity:
  issuer: https://auth.rd.vvivid.dev/realms/vvivid-rd
  webClientID: vocabbank-web
  existingSecret: vocabbank-identity
  gatewayIssuer: https://mcp.rd.lab.vvivid.dev
  gatewayAudience: vocabbank-mcp
  mcpClientIDs: vocabbank-chatgpt
  existingGatewayJWKS: vocabbank-gateway-jwks
persistence:
  claimName: vocabbank-acceptance
  storageClassName: rd-local-retain
  size: 5Gi
resources:
  requests: {cpu: 50m, memory: 128Mi, ephemeral-storage: 64Mi}
  limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 256Mi}
# Existing pinned image supplies sh/cp/chmod to the nonroot init container.
initImage: docker.io/library/postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
ingress:
  enabled: false
tls:
  productionEnabled: false
  trustedCertificateReady: false
provenance:
  sourceSha: UNCONFIGURED
